<sc-for list="{{ pins }}" as="p" hint-placeholder-count="16">
  <div style="position:absolute;left:{{ p.left }};top:{{ p.top }};width:2.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:2px solid #0b1351;box-sizing:border-box;display:flex;align-items:center;justify-content:center;container-type:inline-size">
    <span style="font-family:Figtree,sans-serif;font-weight:800;font-size:52cqw;line-height:1;color:#0b1351">{{ p.n }}</span>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:480},&quot;radius&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;16px&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PINS = [[1855,987],[1762,905],[1728,785],[1808,612],[1880,700],[1990,668],[2010,800],[2150,735],[2262,718],[1960,905],[1575,855],[1605,950],[1300,560],[1385,602],[1360,462],[1280,382],[1985,582]];
class Component extends DCLogic {
  renderVals() {
    return { radius: this.props.radius ?? '16px', pins: PINS.map(([x, y], i) => ({ left: ((x - 580) / 1800 * 100).toFixed(2) + '%', top: ((y - 220) / 960 * 100).toFixed(2) + '%', n: String(i + 1) })) };
  }
}
</script>
